name: Python CI/CD

on:
  push:
    # Se ejecuta solo cuando se sube código a la rama 'quintob'
    branches: [ "quintob" ] 

permissions:
  contents: read
  # Permiso necesario para subir la imagen Docker al Container Registry (ghcr.io)
  packages: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout código
      # Descarga el código del repositorio
      uses: actions/checkout@v4
      
    - name: 🐍 Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: ⚙️ Instalar dependencias
      # Ejecuta pip install usando requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: ✅ Ejecutar Pruebas (pytest)
      # MODIFICACIÓN CLAVE: El '.' le dice a pytest que ejecute las pruebas desde el directorio raíz,
      # lo que corrige el 'ModuleNotFoundError' al encontrar el módulo 'app'.
      run: pytest .
      
    - name: 🔐 Login en GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        # GITHUB_TOKEN es un secreto automático de GitHub
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 🏗️ Construir y Enviar Imagen Docker
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ghcr.io/${{ github.repository }}:latest