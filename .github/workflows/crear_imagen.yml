name: Python application

on:
  push:
    branches: "quintob" 
 
permissions:
  contents: read

  # Necesario para push a ghcr.io
  packages: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout código
      # Descarga el código del repositorio
      uses: actions/checkout@v4
      
    - name: 🐍 Configurar Python 3.10
      uses: actions/setup-python@v5 # Usamos v5 para la versión más reciente del action
      with:
        python-version: "3.10"
        
    - name: ⚙️ Instalar dependencias
      # Ejecuta pip install usando requirements.txt
      run: pip install -r requirements.txt
        
    - name: ✅ Ejecutar Pruebas (pytest)
      # **Este paso faltaba:** Ejecuta las pruebas antes de continuar con Docker
      run: pytest
      
    - name: 🔐 Login en GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        # GITHUB_TOKEN es un secreto automático de GitHub
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 🏗️ Construir y Enviar Imagen Docker
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ghcr.io/${{ github.repository }}:latest